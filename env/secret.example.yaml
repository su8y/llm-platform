# 보안 값(비밀번호·키·토큰·외부 사설 주소)만 모아 둔 compose 조각.
# 각 env/*.yaml 의 config_node 가 이 파일의 서비스를 extends 한다.
# git 에 올리지 않는다. 설치 시 `cp env/secret.example.yaml env/secret.yaml` 후 값을 채운다.
# 호스트·포트·모델명 같은 내부 통신 설정은 env/*.yaml 에 둔다.

services:
  api:
    environment:
      # master 계정 초기 비밀번호. 첫 부팅에만 쓰인다
      ADMIN_USER_PASSWORD: "change-me"
      JWT_SECRET_KEY: "change-me"
      SECRET_KEY: "change-me"
      # database.MYSQL_ROOT_PASSWORD 와 같아야 한다 (api 는 root 로 접속)
      DB_PASSWORD: "change-me"
      # mysql+aiomysql://root:<URL인코딩 비밀번호>@database:3306/llm_platform  ("#"->%23, "@"->%40, "!"->%21)
      DB_URI: "mysql+aiomysql://root:change-me@database:3306/llm_platform"
      VECTOR_DB_TOKEN: "change-me"
      # message-queue.RABBITMQ_DEFAULT_PASS 와 같아야 한다
      MESSAGE_QUEUE_PASS: "change-me"
      # env/vector.yaml 의 MINIO_ROOT_USER 와 같아야 한다
      S3_ACCESS_KEY: "minioadmin"
      # vector.MINIO_ROOT_PASSWORD 와 같아야 한다
      S3_SECRET_KEY: "change-me"
  database:
    environment:
      MYSQL_ROOT_PASSWORD: "change-me"
  message-queue:
    environment:
      RABBITMQ_DEFAULT_PASS: "change-me"
  vector:
    environment:
      MINIO_ROOT_PASSWORD: "change-me"
  mcp:
    environment:
      # MCP 서버 bearer 토큰. ADMIN 은 read/write/admin, READ_TOKENS 는 "토큰:client_id" 를 콤마로 나열
      MCP_ADMIN_TOKEN: "change-me-admin-token"
      MCP_READ_TOKENS: "change-me-read-token:company-a"
      # mcp 는 root 로 접속한다. database.MYSQL_ROOT_PASSWORD 와 같아야 한다
      MYSQL_PASSWORD: "change-me"
      # clickhouse.CLICKHOUSE_PASSWORD 와 같아야 한다
      CLICKHOUSE_PASSWORD: "change-me"
      # 선택. 비우면 로컬 벡터 DB 사용
      PINECONE_API_KEY: ""
      # 선택. 비우면 로컬 벤더 사용
      OPENAI_API_KEY: ""
  llm-proxy:
    environment:
      # vllm serve --api-key 값. 키 없이 띄웠으면 아무 값이나 가능
      VLLM_API_KEY: "change-me"
      # 외부 vLLM 서버 주소 (사설망 주소라 비공개)
      VLLM_URL: "https://vllm.example.internal/v1"
  monitoring:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "change-me"
  clickhouse:
    environment:
      # clickhouse.CLICKHOUSE_PASSWORD 와 같아야 한다
      CLICKHOUSE_PASSWORD: "change-me"
